<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlaceIntel | JSSATEN Placement Intelligence Hub</title>
    <script>
      // Instant theme boot (before first paint) to avoid a flash. Dark is the default.
      (function () {
        try {
          var stored =
            localStorage.getItem("placeintel_theme") || localStorage.getItem("theme") || "dark";
          var isDark = stored !== "light";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light-theme", !isDark);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="min-h-screen bg-background text-foreground antialiased selection:bg-zinc-800 selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
