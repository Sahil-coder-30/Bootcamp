<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlaceIntel | JSSATEN Placement Intelligence Hub</title>
    <script>
      // Instant theme boot (before first paint) to avoid a flash. Dark is the default.
      (function () {
        var light = false;
        try {
          light = localStorage.getItem("theme") === "light";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", !light);
        document.documentElement.classList.toggle("light-theme", light);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body
    class="min-h-screen bg-background text-foreground antialiased selection:bg-zinc-800 selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
