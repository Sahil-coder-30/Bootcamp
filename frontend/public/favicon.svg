<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#07080c"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient: Cyan -> Indigo -> Slate -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Ambient Top Spotlight Glow -->
    <radialGradient id="topGlow" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Emblem Primary Linear Gradient: Crisp White to Vivid Cyan & Indigo -->
    <linearGradient id="emblemGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f9ff"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Intelligence Diamond Beacon Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="120" fill="url(#topGlow)"/>

  <!-- Sleek Outer Stroke -->
  <rect x="5" y="5" width="502" height="502" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Inset Highlight -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Center Monogram -->
  <g filter="url(#softGlow)">
    <!-- Seamless Letter P -->
    <path d="M 145 126
             C 133 126, 125 134, 125 146
             V 366
             C 125 378, 133 386, 145 386
             C 157 386, 165 378, 165 366
             V 276
             H 225
             C 271 276, 305 242, 305 201
             C 305 160, 271 126, 225 126
             Z
             M 165 166
             H 223
             C 248 166, 265 181, 265 201
             C 265 221, 248 236, 223 236
             H 165
             Z"
          fill="url(#emblemGrad)"
          fill-rule="evenodd"/>

    <!-- Letter I Stem -->
    <rect x="333" y="200" width="48" height="172" rx="20" fill="url(#emblemGrad)"/>

    <!-- Intelligence Diamond Beacon (Aligned atop I, matching P height) -->
    <path d="M 357 124
             L 387 158
             L 357 192
             L 327 158
             Z"
          fill="url(#diamondGrad)"/>
    <circle cx="357" cy="158" r="5" fill="#ffffff"/>
  </g>
</svg>