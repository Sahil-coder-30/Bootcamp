# CI for the monorepo: frontend (Vite/React), backend (Express) and agent (FastAPI).
# Each service job runs only when its folder (or this file) changed. The final
# "CI passed" job is the one check to require in branch protection.
# Nothing here needs secrets: LLM providers, Supabase and the agent are all faked in tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
      auth: ${{ steps.filter.outputs.auth }}
      resume: ${{ steps.filter.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
            frontend:
              - *shared
              - frontend/**
            backend:
              - *shared
              - backend/**
            agent:
              - *shared
              - agent/**
            auth:
              - *shared
              - auth/**
            resume:
              - *shared
              - resume/**

  frontend:
    name: Frontend (lint, build, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Test with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Backend (typecheck, build, test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck (src and tests)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test with coverage
        # No Supabase in CI: the API serves the bundled seed data and the live DB tests skip.
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

  agent:
    name: Agent (lint, test)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent/requirements*.txt
      # setup-uv with python-version creates and activates a venv (VIRTUAL_ENV + PATH),
      # so install into it and call the tools by name.
      - name: Install
        run: uv pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check src tests
      - name: Test with coverage
        run: pytest --cov=openradix_agents --cov=talent_match --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-coverage
          path: agent/coverage.xml
          if-no-files-found: ignore

  auth:
    name: Auth (typecheck, build, test)
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: auth
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
      - name: Typecheck (src and tests)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test with coverage (Google is faked; the migration and store run on the Postgres service)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authtest
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage
          path: auth/coverage/lcov.info
          if-no-files-found: ignore

  resume:
    name: Resume service (lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.resume == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: resume
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resumetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: resume/requirements*.txt
      # setup-uv activates its own venv, so the tools are called by name.
      - name: Install (includes the spaCy model wheel)
        run: uv pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy
      - name: Test with coverage (offline parsing; S3 mocked with moto; migration runs on Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resumetest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-coverage
          path: resume/coverage.xml
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-passed:
    name: CI passed
    if: always()
    needs: [frontend, backend, agent, auth, resume, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
