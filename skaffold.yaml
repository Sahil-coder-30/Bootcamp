apiVersion: skaffold/v4beta2
kind: Config

build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: backend
      context: backend
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "src/**"
          - "package.json"

    - image: agent-service
      context: agent
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "src/**"
          - "requirements.txt"

    - image: auth-service
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "src/**"
          - "package.json"

manifests:
  rawYaml:
    - k8s/secrets.yml
    - k8s/ingress.yml
    - k8s/backend-deployment.yml
    - k8s/backend-service.yml
    - k8s/agent-deployment.yml
    - k8s/agent-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
