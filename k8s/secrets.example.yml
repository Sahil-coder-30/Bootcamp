apiVersion: v1
kind: Secret
metadata:
  name: database
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "eyJhbGciOi..."
  SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOi..."
  DATABASE_URL: "postgresql://postgres.xxx:xxx@xxx.supabase.com:5432/postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
type: Opaque
stringData:
  GROQ_API_KEY: "gsk_..."
  OPENROUTER_API_KEY: "sk-or-v1-..."
  GOOGLE_API_KEY: "AQ...."

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  # openssl rand -base64 48 ; the backend deployment reads the same value
  JWT_SECRET: "change-me-to-a-long-random-string-of-48-chars-or-more"
  # Google Cloud Console > APIs & Services > Credentials > OAuth client ID (Web)
  GOOGLE_CLIENT_ID: "123456789-xxxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "GOCSPX-..."

---
apiVersion: v1
kind: Secret
metadata:
  name: resume-secret
type: Opaque
stringData:
  # Every key is optional. Without S3_BUCKET, resume files stay on the resume-data volume.
  S3_BUCKET: "my-resume-bucket"
  AWS_REGION: "ap-south-1"
  AWS_ACCESS_KEY_ID: "AKIA..."
  AWS_SECRET_ACCESS_KEY: "..."
  # Shared secret between backend and resume service (both deployments read it)
  RESUME_API_KEY: "change-me"
