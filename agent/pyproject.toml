# Makes `src/openradix_agents` importable, so `python -m openradix_agents` works
# from the project root. Install it EDITABLE (`-e .`): config.py and registry.py
# find `.env`, `data/` and `prompts/` relative to the source files.
# Dependencies stay pinned in requirements.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openradix-agents"
version = "0.4.0"
description = "OpenRADIX Level 4 - agentic research pipeline"
# LangChain 0.3.x pins don't have reliable wheels on newer Pythons. Fail fast
# with a clear message instead of a cryptic source-build error.
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]
# Level 5 reference code is read-only teaching material, not part of this package.
extend-exclude = ["reference"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import order
select = ["F", "E", "W", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form", "File", "Form"]

[tool.coverage.run]
source = ["openradix_agents", "talent_match"]
omit = ["*/test_*.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
